# agent-iap policy file.
#
# Nothing here is a credential — only *references* to credentials, resolved
# inside the proxy at startup. This file is safe to commit.

[server]
listen = "127.0.0.1:8080"        # where agents connect
admin_listen = "127.0.0.1:8081"  # control plane: the TUI and the MCP bridge
approval_timeout_secs = 120      # an unanswered `ask` denies after this
upstream_timeout_secs = 300          # idle timeout: how long an upstream may go
                                     # silent mid-response, not a total cap, so a
                                     # long token stream is never truncated
upstream_connect_timeout_secs = 30
max_body_bytes = 10485760
# op_binary = "op"               # 1Password CLI used for op:// references
# admin_token = "env:IAP_ADMIN_TOKEN"  # otherwise generated and written to ./admin-token

# --- TLS -------------------------------------------------------------------
# Uncomment to put the proxy on HTTPS. Required the moment an agent is not on
# this host: the agent's token is a bearer token, and this process holds every
# upstream credential behind it. Both values are references, like everything
# else here, and both are resolved *and parsed* at startup — a mismatched pair
# stops the process rather than failing the first handshake.
#
# [server.tls]
# cert = "file:/etc/agent-iap/fullchain.pem"     # PEM chain, leaf first
# key  = "op://Infra/agent-iap tls/private key"  # PEM key: PKCS#8, PKCS#1 or SEC1
# ca   = "file:/etc/agent-iap/root_ca.crt"       # the CA that signed `cert`
#
# `ca` is optional and is what `agent-iap mcp` verifies the control plane against.
# Omit it for a public CA, which every trust store already has, and for a
# self-signed certificate, which is its own CA. Name it for a private CA, so the
# anchor is the root rather than whatever the served chain happens to contain.
# It is read by this process only — agents are other processes, and they need
# the root through their own trust store.
#
# Any provider works — these are PEM files, nothing more. The two shortest
# paths, both written up in the README under "TLS":
#
#   tailscale  sudo tailscale cert --cert-file … --key-file … host.tailnet.ts.net
#              A publicly trusted certificate, so no `ca` and nothing for agents
#              to install. Valid for the ts.net name only, so bind `listen` to
#              the tailnet address rather than 0.0.0.0. 90 days, and renewing
#              means re-running the command and restarting.
#   step-ca    step ca certificate iap.internal.example.com fullchain.pem key.pem
#              step ca root root_ca.crt
#              Your own CA, the way internal x509 usually works: `ca` points at
#              the root, and every host an agent runs on has to be given it too.
#
# The control plane follows onto HTTPS with the same certificate. Give it one of
# its own when that certificate does not name the address the control plane is
# reached at — a cert for host.tailnet.ts.net is not valid for 127.0.0.1, and
# `agent-iap mcp` dials `admin_listen` and does check the name:
#
# [server.admin_tls]
# cert = "file:/etc/agent-iap/admin-fullchain.pem"
# key  = "file:/etc/agent-iap/admin-key.pem"
# ca   = "file:/etc/agent-iap/root_ca.crt"

# Workload identity. The agent token above says *who* is calling; it is
# long-lived and identical for every call that agent ever makes. A workload
# token says what one run is for and until when: the agent exchanges its token
# at POST /_iap/token for a JWT this proxy signs, scoped to the requests it
# named and expiring on its own.
#
#   off       agent tokens only, as before
#   optional  both accepted — migrate with nothing breaking (the default)
#   required  the data plane takes workload tokens only, and the agent token
#             becomes a bootstrap credential that does nothing but mint one
[server.workload_identity]
mode = "optional"
lifetime_secs = 3600             # ceiling as well as default; 60s–3600s

[audit]
path = "audit/iap-audit.jsonl"
stderr = true
log_bodies = false               # bodies carry prompts and customer data
log_mcp_params = false           # JSON-RPC params likewise
max_logged_body_bytes = 4096
redact_headers = ["authorization", "x-api-key", "cookie", "x-iap-token"]

# --- who may connect -------------------------------------------------------
# Mint a token with `agent-iap gen-token claude-code`. It is not an upstream
# credential; revoking it costs nothing and rotates nothing else.

[[agents]]
id = "claude-code"
name = "Claude Code"
# Replace with the hash printed by `agent-iap gen-token claude-code`. Left
# deliberately invalid: an unedited policy file should refuse to start, not come
# up looking healthy with an agent that can never authenticate.
token_sha256 = "REPLACE_ME_WITH_THE_OUTPUT_OF_gen-token"
targets = ["anthropic", "github", "gcs", "github-mcp"]

# --- what they may reach ---------------------------------------------------
# The agent calls http://127.0.0.1:8080/<name>/<path>; the proxy strips the
# prefix and adds the real credential.

[[upstreams]]
name = "anthropic"
base_url = "https://api.anthropic.com"
auth = { type = "header", header = "x-api-key", secret = "op://Private/Anthropic API/credential" }
headers = { "anthropic-version" = "2023-06-01" }

[[upstreams]]
name = "github"
base_url = "https://api.github.com"
auth = { type = "bearer", secret = "op://Private/GitHub/token" }

# A Google service account. The proxy signs a JWT with the account's key,
# exchanges it at Google's token endpoint for an access token that lives an
# hour, and injects that. The agent sees neither the key nor the token.

[[upstreams]]
name = "gcs"
base_url = "https://storage.googleapis.com"

[upstreams.auth]
type = "service_account_jwt"
key_file = "op://Private/GCP Service Account/credential"   # the JSON Google issued
scopes = ["https://www.googleapis.com/auth/devstorage.read_only"]
# subject = "person@example.com"   # domain-wide delegation: act as this user
# lifetime_secs = 3600             # assertion lifetime, clamped to Google's one-hour ceiling

# Other supported schemes:
#   auth = { type = "basic", username = "user", secret = "env:PASSWORD" }
#   auth = { type = "query", param = "key", secret = "file:/run/secrets/key" }
#   auth = { type = "oauth2_client_credentials", token_url = "https://issuer/oauth/token",
#            client_id = "abc", client_secret = "op://Private/IdP/client_secret",
#            scope = "read:data" }
#   auth = { type = "none" }
#
# Any other RFC 7523 provider, with the pieces spelled out instead of a Google
# key file:
#   [upstreams.auth]
#   type = "service_account_jwt"
#   issuer = "service@example.com"
#   private_key = "file:/run/secrets/service-account.pk8.pem"   # PKCS#8 PEM
#   token_url = "https://auth.example.com/oauth/token"
#   audience = "https://api.example.com"   # defaults to token_url
#   scopes = ["read:data"]

# --- MCP servers -----------------------------------------------------------
# The agent runs `agent-iap mcp --server github-mcp` as its MCP server. The real
# server is spawned here, with the credential in *its* environment.

[[mcp_servers]]
name = "github-mcp"
transport = "stdio"
command = "docker"
args = ["run", "-i", "--rm", "-e", "GITHUB_PERSONAL_ACCESS_TOKEN", "ghcr.io/github/github-mcp-server"]
env = { GITHUB_PERSONAL_ACCESS_TOKEN = "op://Private/GitHub/token" }

# A remote MCP endpoint instead:
# [[mcp_servers]]
# name = "remote-mcp"
# transport = "http"
# url = "https://mcp.example.com/mcp"
# auth = { type = "bearer", secret = "op://Private/Example/token" }

# --- policy ----------------------------------------------------------------
# First matching rule wins. Anything unmatched falls through to acl_default.
# `paths` are URL paths for http and tool / resource names for mcp.
#
# Any rule may carry `expires = "<RFC 3339>"`. Past it the rule matches nothing
# and whatever is behind it decides instead, so a grant ends on the clock rather
# than on somebody remembering to take it away. Checked on every request, so it
# survives a restart; `agent-iap acl add --expires-in 90m` writes one, and so
# does the approval console's dialogue. See the last rule in this file.

[[acl]]
name = "anthropic-inference"
agent = "claude-code"
kind = "http"
target = "anthropic"
methods = ["POST"]
paths = ["/v1/messages", "/v1/messages/count_tokens"]
action = "allow"

[[acl]]
name = "github-reads"
agent = "claude-code"
kind = "http"
target = "github"
methods = ["GET"]
paths = ["/repos/**", "/user", "/search/**"]
action = "allow"

[[acl]]
name = "github-writes-need-a-human"
agent = "claude-code"
kind = "http"
target = "github"
methods = ["POST", "PATCH", "PUT", "DELETE"]
paths = ["/repos/**"]
action = "ask"

[[acl]]
name = "gcs-object-reads"
agent = "claude-code"
kind = "http"
target = "gcs"
methods = ["GET"]
paths = ["/storage/v1/b/*/o", "/storage/v1/b/*/o/**"]
action = "allow"

# MCP: the handshake and discovery are harmless, so allow them outright.
[[acl]]
name = "mcp-handshake"
kind = "mcp"
target = "github-mcp"
methods = ["initialize", "ping", "notifications/*", "tools/list", "resources/list", "prompts/list"]
action = "allow"

[[acl]]
name = "mcp-reads"
kind = "mcp"
target = "github-mcp"
methods = ["tools/call"]
paths = ["get_*", "list_*", "search_*"]
action = "allow"

# Everything else this server can do gets a prompt rather than a silent yes.
[[acl]]
name = "mcp-anything-else-asks"
kind = "mcp"
target = "github-mcp"
action = "ask"

[acl_default]
action = "deny"

# A grant with a deadline on it. This one has long since run out, which is what
# an expired rule looks like when you find it: still numbered, still listed, and
# deciding nothing. `agent-iap list acl` shows it as `expired`.
# [[acl]]
# name = "migration-window"
# agent = "claude-code"
# kind = "http"
# target = "github"
# methods = ["POST"]
# paths = ["/repos/acme/**"]
# action = "allow"
# expires = "2026-01-01T09:00:00Z"
